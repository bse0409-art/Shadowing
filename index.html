<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>따라 말하기 연습</title>
<style>
/* 레이아웃: 위에 영상, 가운데 노래방 자막 카드, 아래 큰 버튼. 부모용 도구는 길게 눌러 여는 패널 */
:root{
  --bg:#EEF4F7; --card:#FFFFFF; --ink:#16283A; --ink2:#5A6B7B; --line:#D5E0E8;
  --accent:#0E7C86; --accent-ink:#FFFFFF; --fill:#E8412C; --rec:#D92D20; --ok:#2E8B57;
  --chip-bg:#E3EEF2; --shadow:0 2px 0 rgba(22,40,58,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A22; --card:#17252F; --ink:#E8F0F5; --ink2:#9BB0BF; --line:#2A3C49;
  --accent:#3CB4BF; --accent-ink:#06242A; --fill:#FF7A5C; --rec:#FF6B5E; --ok:#5CC48A;
  --chip-bg:#1F3340; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A22; --card:#17252F; --ink:#E8F0F5; --ink2:#9BB0BF; --line:#2A3C49;
  --accent:#3CB4BF; --accent-ink:#06242A; --fill:#FF7A5C; --rec:#FF6B5E; --ok:#5CC48A;
  --chip-bg:#1F3340; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;line-height:1.35}
.app{max-width:560px;margin:0 auto;padding:12px max(14px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:env(safe-area-inset-top,0px)}
h1{font-size:1.05rem;margin:0;font-weight:700}
.count{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:.95rem}
.gear{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:10px;width:44px;height:36px;font-size:1.1rem;touch-action:manipulation;position:relative;overflow:hidden}
.gear i{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--accent)}
.gear.hold i{width:100%;transition:width .7s linear}

.stage{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:490/360}
video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;padding:20px;color:#DCE8EE;background:#1B2B36}
.ph p{margin:0;font-size:.95rem;color:#B9CAD5;max-width:30ch}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 16px;box-shadow:var(--shadow)}
.meta{display:flex;align-items:center;gap:8px;min-height:28px;margin-bottom:6px}
.chip{background:var(--chip-bg);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:600}
.recdot{margin-left:auto;font-size:.82rem;color:var(--ink2);display:flex;align-items:center;gap:5px}
.recdot b{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.recdot.has b{background:var(--ok)}
.recdot.live b{background:var(--rec);animation:pulse 1s infinite}
.recdot.live{color:var(--rec);font-weight:700}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.recdot.live b{animation:none}}
.en{font-size:clamp(1.6rem,7.2vw,2.15rem);font-weight:800;line-height:1.3;margin:4px 0 6px;word-break:keep-all;overflow-wrap:anywhere}
.w{--p:0;display:inline-block;margin-right:.28em;color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:linear-gradient(90deg,var(--fill) calc(var(--p)*100%),var(--ink) calc(var(--p)*100%))}
.ko{font-size:1rem;color:var(--ink2);margin:0}
.status{min-height:1.4em;font-size:.9rem;color:var(--ink2);margin:8px 0 0}
.status.err{color:var(--rec);font-weight:600}

.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{appearance:none;border:0;border-radius:16px;padding:12px 6px;min-height:76px;font:inherit;font-weight:700;font-size:1rem;
  background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:manipulation}
.btn span.ic{font-size:1.6rem;line-height:1}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4}
.btn.listen{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.mic{background:var(--rec);color:#fff;border-color:transparent}
.btn.mic.on{outline:4px solid color-mix(in srgb,var(--rec) 35%,transparent)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nav .btn{min-height:52px;flex-direction:row;font-size:1rem}
.wide{min-height:56px;flex-direction:row;width:100%;gap:8px}
.focus-ring:focus-visible,.btn:focus-visible,.gear:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 부모용 패널 */
.panel{background:var(--card);border:1px dashed var(--accent);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:.95rem;margin:0}
.panel p{margin:0;font-size:.88rem;color:var(--ink2)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sm{padding:8px 10px;appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:.9rem;font-weight:600;min-height:40px;touch-action:manipulation}
.sm.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.sm.warn{color:var(--rec)}
.num{font-variant-numeric:tabular-nums;min-width:4.5em;text-align:center;font-weight:700;font-size:1.05rem}
.lbl{font-size:.85rem;color:var(--ink2);min-width:3em}
textarea{width:100%;min-height:90px;font:12px/1.3 ui-monospace,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px}
.tapbtn{min-height:84px;font-size:1.15rem}
.tag{font-size:.8rem;background:var(--chip-bg);padding:2px 8px;border-radius:8px}
label.chk{display:flex;gap:8px;align-items:center;font-size:.95rem}
#file,#sfile{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:90vw;z-index:20;font-size:.95rem}
.tapbtn{min-height:130px;width:100%;font-size:1.35rem;background:var(--fill);color:#fff;border:0;margin-top:10px}
.btn.strong{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.wzhelp{margin:0 0 6px;font-size:.95rem;color:var(--ink2)}
body.wizing .card:not(.wiz), body.wizing .actions, body.wizing .nav, body.wizing #bMovie, body.wizing #panel{display:none!important}
details summary{cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>따라 말하기 연습</h1>
    <div class="count" id="count">1 / 1</div>
    <button class="gear" id="gear" aria-label="부모용 설정 (길게 누르기)" title="길게 누르기">⚙<i></i></button>
  </header>

  <div class="stage">
    <video id="v" playsinline preload="auto"></video>
    <div class="ph" id="ph">
      <div style="font-size:2rem">🎬</div>
      <p id="phMsg"></p>
      <label class="sm pick" for="sfile" id="pick0" style="min-height:48px;font-size:1rem;display:inline-flex;align-items:center;padding:0 22px">1. 대본 파일 고르기</label>
      <label class="sm pri pick" for="file" id="pick1" style="min-height:48px;font-size:1rem;display:inline-flex;align-items:center;padding:0 22px">2. 영상 고르기</label>
      <p style="font-size:.8rem">파일 선택창에서 '다운로드' 같은 폴더를 열 수 있어요.</p>
    </div>
  </div>

  <section class="card wiz" id="wiz" hidden>
    <div class="meta"><span class="chip" id="wzNum">1 / 43</span><button class="sm" id="wzExit" style="margin-left:auto">그만하기</button></div>
    <p class="wzhelp">영상을 보면서, <b>아래 문장이 들리기 시작하는 순간</b> 큰 버튼을 눌러 주세요.<br>문장 앞의 음악이나 효과음은 무시하세요.</p>
    <div class="en" id="wzEn"></div><p class="ko" id="wzKo"></p>
    <button class="btn tapbtn" id="wzTap">🙋 들렸어요! (누르기)</button>
    <div class="row" style="margin-top:10px"><button class="sm" id="wzBack">◀ 앞 문장으로</button><button class="sm" id="wzReplay">↺ 5초 전부터 다시</button></div>
  </section>

  <section class="card" aria-live="polite">
    <div class="meta">
      <span class="chip" id="sp">할머니</span>
      <span class="recdot" id="recdot"><b></b><span id="rectxt">내 목소리 없음</span></span>
    </div>
    <div class="en" id="en"></div>
    <p class="ko" id="ko"></p>
    <p class="status" id="status"></p>
  </section>

  <div class="actions">
    <button class="btn listen" id="bListen"><span class="ic">🔊</span>듣기</button>
    <button class="btn mic" id="bMic"><span class="ic">🎤</span><span id="micTxt">말하기</span></button>
    <button class="btn" id="bMine" disabled><span class="ic">▶️</span>내 목소리</button>
  </div>
  <div class="nav">
    <button class="btn" id="bPrev">◀ 이전</button>
    <button class="btn" id="bNext">다음 ▶</button>
  </div>
  <button class="btn wide" id="bMovie">🎞️ 내 목소리로 영상 보기</button>

  <section class="panel" id="panel" hidden>
    <h2>부모용 설정</h2>
    <button class="btn wide strong" id="wzStart0">🎯 처음부터 시간 맞추기 (추천)</button>
    <button class="btn wide" id="wzStartHere">📍 지금 문장부터 다시 맞추기</button>
    <div class="row">
      <label class="sm pri pick" for="file" id="pick2" style="display:inline-flex;align-items:center">영상 다시 고르기</label>
      <label class="sm pick" for="sfile" style="display:inline-flex;align-items:center">대본 다시 고르기</label>
      <button class="sm" id="micTest">🎤 마이크 확인</button>
    </div>
    <p id="sBadge" style="margin:0"></p>
    <label class="chk"><input type="checkbox" id="showKo" checked style="display:inline;width:20px;height:20px"> 한글 보이기</label>
    <details>
      <summary class="sm" style="display:inline-block">세밀 조정 · 시간표 보관</summary>
      <div style="display:flex;flex-direction:column;gap:12px;margin-top:12px">
      <div>
        <h2>지금 문장</h2>
        <div class="row" style="margin-top:6px"><span class="lbl">시작</span>
          <button class="sm" data-adj="s,-0.5">−0.5</button><button class="sm" data-adj="s,-0.1">−0.1</button>
          <span class="num" id="vs">0.00</span>
          <button class="sm" data-adj="s,0.1">+0.1</button><button class="sm" data-adj="s,0.5">+0.5</button>
          <button class="sm" data-now="s">지금 위치로</button></div>
        <div class="row" style="margin-top:6px"><span class="lbl">끝</span>
          <button class="sm" data-adj="e,-0.5">−0.5</button><button class="sm" data-adj="e,-0.1">−0.1</button>
          <span class="num" id="ve">0.00</span>
          <button class="sm" data-adj="e,0.1">+0.1</button><button class="sm" data-adj="e,0.5">+0.5</button>
          <button class="sm" data-now="e">지금 위치로</button></div>
        <div class="row" style="margin-top:8px"><span class="lbl">영상</span><span class="num" id="vt">0.00</span>
          <button class="sm" id="pp">⏯ 재생/멈춤</button>
          <button class="sm" data-seek="-3">−3초</button><button class="sm" data-seek="3">+3초</button></div>
      </div>
      <div>
        <h2>시간표 보관</h2>
        <textarea id="json" spellcheck="false"></textarea>
        <div class="row" style="margin-top:6px">
          <button class="sm" id="jCopy">복사</button><button class="sm" id="jLoad">붙여넣은 시간표 적용</button>
          <button class="sm warn" id="recClear">녹음 전부 지우기</button><button class="sm warn" id="timeReset">시간 초안으로 되돌리기</button>
        </div>
      </div></div>
    </details>
  </section>
</div>
<input type="file" id="file">
<input type="file" id="sfile">
<div class="toast" id="toast" hidden></div>

<script>
let DATA=null, CH=[], DRAFT=[], RUNS=[], TKEY='shadow_times_x';
const SKEY='shadow_script_v1';
const $=s=>document.querySelector(s);
const v=$('#v');
let idx=0, act={type:'idle'}, raf=0, timers=[], videoReady=false, adjusted=false;
const recs=new Map();            // idx -> {blob, ms, url}
let stream=null, mr=null, mrChunks=[], mrDiscard=false, mrStart=0;
let audio=null, recIdx=0;

function saveTimes(){adjusted=true;try{localStorage.setItem(TKEY,JSON.stringify(CH.map(c=>[c.s,c.e])))}catch(e){}$('#json').value=JSON.stringify(CH.map(c=>[+c.s.toFixed(2),+c.e.toFixed(2)]))}
const r2=x=>Math.round(x*100)/100;

/* ---------- 화면 그리기 ---------- */
let words=[], wTimes=[];
function buildWords(i){
  const c=CH[i]; const tk=c.en.split(/\s+/);
  const wt=tk.map(t=>Math.max(2,t.replace(/[^A-Za-z0-9]/g,'').length)+1);
  const pause=tk.map(t=>/[,.:;?!…]$/.test(t)?2.5:0);
  let tot=0; wTimes=[]; wt.forEach((w,k)=>{wTimes.push([tot,tot+w]); tot+=w+pause[k]});
  wTimes=wTimes.map(([a,b])=>[a/tot,b/tot]);
  const el=$('#en'); el.textContent='';
  words=tk.map(t=>{const s=document.createElement('span');s.className='w';s.textContent=t;el.appendChild(s);el.appendChild(document.createTextNode(' '));return s});
}
function setFill(f){words.forEach((s,k)=>{const [a,b]=wTimes[k];s.style.setProperty('--p',Math.max(0,Math.min(1,(f-a)/(b-a))).toFixed(3))})}
function status(t,err){const s=$('#status');s.textContent=t||'';s.classList.toggle('err',!!err)}
function toast(t,ms=2200){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,ms)}
function render(i,keepFill){
  idx=i; const c=CH[i];
  $('#count').textContent=(i+1)+' / '+CH.length;
  $('#sp').textContent=c.sp; $('#ko').textContent=c.ko; $('#ko').hidden=!$('#showKo').checked;
  buildWords(i); setFill(keepFill||0);
  refreshRec(); refreshEditor();
  $('#bPrev').disabled=i===0; $('#bNext').disabled=i===CH.length-1;
}
function refreshRec(){
  const has=recs.has(idx), live=(act.type==='record'||act.type==='countin');
  const d=$('#recdot'); d.classList.toggle('has',has&&!live); d.classList.toggle('live',live);
  $('#rectxt').textContent=live?'녹음 중':(has?'내 목소리 있음':'내 목소리 없음');
  $('#bMine').disabled=!has;
  $('#micTxt').textContent=live?'그만':(has?'다시 말하기':'말하기');
  $('#bMic').classList.toggle('on',live);
}
function refreshEditor(){
  const c=CH[idx]; $('#vs').textContent=c.s.toFixed(2); $('#ve').textContent=c.e.toFixed(2);
  $('#json').value=JSON.stringify(CH.map(x=>[+x.s.toFixed(2),+x.e.toFixed(2)]));
}

/* ---------- 재생/녹음 제어 ---------- */
function stopAll(){
  cancelAnimationFrame(raf); timers.forEach(clearTimeout); timers=[];
  if(mr&&mr.state!=='inactive'){mrDiscard=true;try{mr.stop()}catch(e){}}
  if(audio){try{audio.pause()}catch(e){} audio=null}
  try{v.pause()}catch(e){}
  v.muted=false; act={type:'idle'}; refreshRec(); $('#bMovie').textContent='🎞️ 내 목소리로 영상 보기';
}
function needVideo(){ if(!CH.length){toast('먼저 대본 파일을 골라 주세요');return false} if(!videoReady){toast('먼저 영상을 골라 주세요');return false} return true }
function loop(){
  raf=requestAnimationFrame(loop);
  const c=CH[idx];
  if(act.type==='listen'||act.type==='record'){
    const t=v.currentTime, f=(t-c.s)/(c.e-c.s); setFill(f);
    if(t>=c.e||v.ended){
      v.pause(); setFill(1);
      if(act.type==='listen'){ cancelAnimationFrame(raf); act={type:'idle'}; status('') }
      else if(!act.ending){ act.ending=true; status('끝! 잠깐만요…'); timers.push(setTimeout(()=>finishRecord(),700)); }
    }
  }else if(act.type==='mine'){
    const f=(performance.now()-act.t0)/act.ms; setFill(f);
    if(f>=1){cancelAnimationFrame(raf);act={type:'idle'};setFill(1)}
  }else if(act.type==='movie'){
    const t=v.currentTime; const j=CH.findIndex(x=>t>=x.s-0.05&&t<=x.e+0.05);
    if(j>=0){
      if(j!==idx||act.cur!==j){ idx=j; render(j); act.cur=j;
        if(recs.has(j)){v.muted=true; playRec(j,true)} else {v.muted=false}
      }
      setFill((t-CH[j].s)/(CH[j].e-CH[j].s));
    }else if(act.cur!=null){ act.cur=null; v.muted=false; if(audio){}}
    if(t>CH[CH.length-1].e+0.8||v.ended){stopAll();status('영상 끝!')}
  }else if(act.type==='tap'){
    $('#vt').textContent=v.currentTime.toFixed(2);
  }
}
function listen(i){
  if(!needVideo())return; stopAll(); if(i!=null&&i!==idx)render(i);
  const c=CH[idx]; setFill(0); v.muted=false; v.currentTime=c.s; act={type:'listen'}; status('잘 들어 보세요');
  v.play().catch(()=>status('재생이 막혔어요. 버튼을 다시 눌러 주세요.',true)); loop();
}
async function ensureMic(){
  if(stream&&stream.active) return stream;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('nomic');
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  return stream;
}
function pickMime(){const m=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'];return m.find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported(x))||''}
function micHelp(e){
  const pr=location.protocol;
  if(!window.isSecureContext||!navigator.mediaDevices) return '이 열기 방식('+pr+')에서는 마이크를 쓸 수 없어요.';
  if(e&&e.name==='NotAllowedError') return '마이크가 막혀 있어요. 주소창 왼쪽 아이콘 → 권한 → 마이크를 허용으로 바꾸고 새로고침해 주세요. (열기 방식: '+pr+')';
  if(e&&e.name==='NotFoundError') return '마이크를 찾지 못했어요.';
  return '마이크를 켤 수 없어요. ('+((e&&e.name)||'오류')+')';
}
async function startRecord(){
  if(!needVideo())return;
  if(act.type==='record'||act.type==='countin'){ if(act.type==='record'){finishRecord()} return }
  stopAll();
  try{await ensureMic()}catch(e){
    status(micHelp(e),true);return}
  const mime=pickMime(); mrChunks=[]; mrDiscard=false;
  try{mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined)}catch(e){status('녹음을 시작하지 못했어요.',true);return}
  mr.ondataavailable=e=>{if(e.data&&e.data.size)mrChunks.push(e.data)};
  mr.onstop=()=>{ if(mrDiscard){mrChunks=[];return}
    const blob=new Blob(mrChunks,{type:mr.mimeType||mime||'audio/webm'}); const ms=Math.max(600,performance.now()-mrStart);
    saveRec(recIdx,blob,ms); };
  const c=CH[idx]; recIdx=idx; setFill(0); v.muted=true; v.currentTime=c.s;
  act={type:'countin'}; refreshRec(); status('준비… 곧 시작해요');
  timers.push(setTimeout(()=>{act={type:'record'};refreshRec();status('따라 말해 보세요!');mrStart=performance.now();mr.start();v.play().catch(()=>{});loop()},900));
}
function finishRecord(){
  cancelAnimationFrame(raf); timers.forEach(clearTimeout); timers=[]; try{v.pause()}catch(e){}
  if(mr&&mr.state!=='inactive'){mrDiscard=false;try{mr.stop()}catch(e){}}
  act={type:'idle'}; v.muted=false; refreshRec();
}
function saveRec(i,blob,ms){
  const old=recs.get(i); if(old&&old.url)URL.revokeObjectURL(old.url);
  recs.set(i,{blob,ms,url:URL.createObjectURL(blob)}); idbPut(i,{blob,ms});
  refreshRec(); status('저장했어요! 들어볼까요?'); setTimeout(()=>{if(act.type==='idle'&&idx===i)playRec(i)},250);
}
function playRec(i,inMovie){
  const r=recs.get(i); if(!r)return;
  if(audio){try{audio.pause()}catch(e){}}
  audio=new Audio(r.url); audio.play().catch(()=>status('소리 재생이 막혔어요.',true));
  if(!inMovie){ setFill(0); act={type:'mine',t0:performance.now(),ms:r.ms}; status('내 목소리'); loop() }
}
function go(d){stopAll();const j=Math.max(0,Math.min(CH.length-1,idx+d));render(j);status('')}

/* ---------- 내 목소리로 영상 보기 ---------- */
function movie(){
  if(!needVideo())return;
  if(act.type==='movie'){stopAll();return}
  stopAll(); idx=0; v.currentTime=Math.max(0,CH[0].s-1.2); v.muted=false; act={type:'movie',cur:null};
  $('#bMovie').textContent='⏹ 멈추기'; status('내 목소리가 있는 문장은 영상 소리를 끄고 들려줘요');
  v.play().catch(()=>status('재생이 막혔어요.',true)); loop();
}

/* ---------- 대본 파일 ---------- */
function loadScript(obj,persist){
  if(!obj||!Array.isArray(obj.chunks)||!obj.chunks.length||!obj.chunks.every(c=>typeof c.en==='string'&&isFinite(c.s)&&isFinite(c.e))) throw new Error('bad');
  stopAll(); DATA=obj; CH=obj.chunks.map(c=>({sp:c.sp||'',en:c.en,ko:c.ko||'',s:+c.s,e:+c.e})); DRAFT=CH.map(c=>[c.s,c.e]); RUNS=obj.runs||[];
  TKEY='shadow_times_'+(obj.id||'x');
  try{const t=JSON.parse(localStorage.getItem(TKEY)||'null'); if(Array.isArray(t)&&t.length===CH.length){t.forEach((x,i)=>{CH[i].s=x[0];CH[i].e=x[1]})}}catch(e){}
  if(persist){try{localStorage.setItem(SKEY,JSON.stringify(obj))}catch(e){}}
  idx=0; render(0); phUpdate();
}
function phUpdate(){
  $('#phMsg').textContent=CH.length?(videoReady?'':'대본을 불러왔어요 ('+(DATA.title||CH.length+'문장')+'). 이제 영상을 골라 주세요.'):'먼저 대본 파일(.json)을 골라 주세요.';
  $('#sBadge').textContent=CH.length?'✓ 대본: '+(DATA.title||CH.length+'문장'):'';
}
$('#sfile').onchange=e=>{
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=()=>{try{loadScript(JSON.parse(r.result),true);toast('대본을 불러왔어요')}catch(x){toast('대본 파일 형식이 맞지 않아요')}};
  r.readAsText(f,'utf-8'); e.target.value='';
};

/* ---------- 영상 고르기 ---------- */
$('#file').onchange=e=>{
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  if(!(/^video\//.test(f.type)||/\.(mp4|m4v|mov|webm|mkv)$/i.test(f.name))){toast('영상 파일(mp4)을 골라 주세요');e.target.value='';return}
  stopAll(); if(v.dataset.u)URL.revokeObjectURL(v.dataset.u);
  const u=URL.createObjectURL(f); v.dataset.u=u; v.src=u; v.load();
  v.onloadedmetadata=()=>{videoReady=true;$('#ph').hidden=true;phUpdate();
    if(DATA&&DATA.duration&&Math.abs(v.duration-DATA.duration)>6){status('영상 길이가 달라서 시간표가 안 맞을 수 있어요.',true)} else status('영상을 불러왔어요. 🔊 듣기를 눌러 보세요.');
    listenPrime()};
  v.onerror=()=>{status('이 영상은 열 수 없어요.',true)};
};
function listenPrime(){try{if(CH.length)v.currentTime=CH[idx].s}catch(e){}}

/* ---------- 부모용 패널 ---------- */
(function(){
  const g=$('#gear'); let h=null;
  const open=()=>{const p=$('#panel');p.hidden=!p.hidden;if(!p.hidden)p.scrollIntoView({behavior:'smooth',block:'start'});g.classList.remove('hold')};
  g.addEventListener('pointerdown',()=>{g.classList.add('hold');h=setTimeout(open,700)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>g.addEventListener(ev,()=>{clearTimeout(h);g.classList.remove('hold')}));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
  g.addEventListener('contextmenu',e=>e.preventDefault());
})();
document.querySelectorAll('[data-adj]').forEach(b=>b.onclick=()=>{
  const [k,d]=b.dataset.adj.split(','); const c=CH[idx]; c[k]=Math.max(0,r2(c[k]+parseFloat(d)));
  if(c.e<c.s+0.3)c.e=r2(c.s+0.3); saveTimes(); refreshEditor(); listen(idx)});
document.querySelectorAll('[data-now]').forEach(b=>b.onclick=()=>{
  if(!needVideo())return; const k=b.dataset.now; const c=CH[idx]; c[k]=r2(v.currentTime); if(c.e<c.s+0.3)c.e=r2(c.s+0.3); saveTimes(); refreshEditor()});
document.querySelectorAll('[data-seek]').forEach(b=>b.onclick=()=>{if(needVideo())v.currentTime=Math.max(0,v.currentTime+parseFloat(b.dataset.seek))});
$('#pp').onclick=()=>{if(!needVideo())return; if(v.paused){v.muted=false;v.play()}else v.pause()};
v.addEventListener('timeupdate',()=>{if(!$('#panel').hidden)$('#vt').textContent=v.currentTime.toFixed(2)});
$('#showKo').onchange=()=>{$('#ko').hidden=!$('#showKo').checked};
$('#jCopy').onclick=async()=>{const t=$('#json');try{await navigator.clipboard.writeText(t.value);toast('복사했어요')}catch(e){t.select();toast('선택했어요. 길게 눌러 복사하세요')}};
$('#jLoad').onclick=()=>{try{const a=JSON.parse($('#json').value);if(!Array.isArray(a)||a.length!==CH.length)throw 0;a.forEach((x,i)=>{CH[i].s=+x[0];CH[i].e=+x[1]});saveTimes();render(idx);toast('적용했어요')}catch(e){toast('시간표 형식이 맞지 않아요')}};
$('#timeReset').onclick=()=>{DRAFT.forEach((x,i)=>{CH[i].s=x[0];CH[i].e=x[1]});try{localStorage.removeItem(TKEY)}catch(e){}render(idx);toast('초안으로 되돌렸어요')};
$('#recClear').onclick=()=>{stopAll();recs.forEach(r=>r.url&&URL.revokeObjectURL(r.url));recs.clear();idbClear();refreshRec();toast('녹음을 모두 지웠어요')};

/* ---------- 시간 맞추기 마법사 ---------- */
let wz=false, wi=0;
const estDur=i=>Math.max(0.8,CH[i].en.split(/\s+/).length*0.42+0.3);
function snapOnset(t){let best=null;for(const r of RUNS){if(r[1]>=t-1.0&&r[1]<=t+0.05){const d=r[1]-r[0];if(!best||d>=best.d)best={a:r[0],b:r[1],d}}}return best}
function wzRender(){$('#wzNum').textContent=(wi+1)+' / '+CH.length;$('#wzEn').textContent=CH[wi].en;$('#wzKo').textContent=CH[wi].ko}
function wzPlayFrom(t){v.muted=false;v.currentTime=Math.max(0,t);act={type:'wiz'};v.play().catch(()=>toast('재생이 막혔어요. 버튼을 다시 눌러 주세요'))}
function startWizard(from){
  if(!needVideo())return; stopAll(); wi=from; wz=true; document.body.classList.add('wizing'); $('#wiz').hidden=false;
  wzRender(); window.scrollTo(0,0);
  wzPlayFrom(wi===0?Math.max(0,CH[0].s-7):CH[wi].s-4);
}
function endWizard(msg){stopAll();wz=false;document.body.classList.remove('wizing');$('#wiz').hidden=true;render(Math.min(wi,CH.length-1));if(msg)toast(msg,3800)}
$('#wzStart0').onclick=()=>{$('#panel').hidden=true;startWizard(0)};
$('#wzStartHere').onclick=()=>{$('#panel').hidden=true;startWizard(idx)};
$('#wzExit').onclick=()=>endWizard('');
$('#wzBack').onclick=()=>{if(!wz)return;wi=Math.max(0,wi-1);wzRender();wzPlayFrom(CH[wi].s-3)};
$('#wzReplay').onclick=()=>{if(!wz)return;wzPlayFrom(v.currentTime-5)};
$('#wzTap').onclick=()=>{
  if(!wz)return; const t=v.currentTime; const sn=snapOnset(t);
  const ns=r2(Math.max(0,sn?sn.b:t-0.3));
  if(wi>0){const pv=CH[wi-1]; const pe=sn?sn.a:ns-0.3; pv.e=r2(Math.max(pv.s+0.3,Math.min(pe,ns-0.05)))}
  CH[wi].s=ns; CH[wi].e=r2(ns+estDur(wi)); saveTimes();
  if(wi>=CH.length-1){ // 마지막 문장 끝 찾기
    const c=CH[wi]; const r=RUNS.find(x=>x[0]>=c.s+Math.max(0.8,estDur(wi)*0.7)); if(r)c.e=r2(r[0]); saveTimes(); endWizard('다 맞췄어요! 🔊 듣기로 확인해 보세요'); return}
  toast('✓ '+CH[wi].en,700); wi++; wzRender();
};
v.addEventListener('ended',()=>{if(wz)endWizard('영상이 끝났어요. 맞춘 곳까지 저장했어요')});
$('#micTest').onclick=async()=>{try{await ensureMic();toast('마이크를 쓸 수 있어요!',4000)}catch(e){const m=micHelp(e);toast(m,9000)}};

/* ---------- 버튼 ---------- */
$('#bListen').onclick=()=>listen();
$('#bMic').onclick=()=>startRecord();
$('#bMine').onclick=()=>{stopAll();playRec(idx)};
$('#bPrev').onclick=()=>go(-1); $('#bNext').onclick=()=>go(1);
$('#bMovie').onclick=movie;

/* ---------- 녹음 보관 (IndexedDB, 안 되면 이번 접속 동안만) ---------- */
let db=null;
function idbOpen(){return new Promise(res=>{try{const q=indexedDB.open('shadowing_rec',1);q.onupgradeneeded=()=>q.result.createObjectStore('r');q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)}catch(e){res(null)}})}
async function idbPut(i,val){try{db=db||await idbOpen();if(!db)return;db.transaction('r','readwrite').objectStore('r').put(val,i)}catch(e){}}
async function idbClear(){try{db=db||await idbOpen();if(!db)return;db.transaction('r','readwrite').objectStore('r').clear()}catch(e){}}
async function idbLoad(){try{db=await idbOpen();if(!db)return;
  await new Promise(res=>{const st=db.transaction('r').objectStore('r');const q=st.openCursor();
    q.onsuccess=()=>{const c=q.result;if(c){const r=c.value;recs.set(c.key,{blob:r.blob,ms:r.ms,url:URL.createObjectURL(r.blob)});c.continue()}else res()};q.onerror=()=>res()})}catch(e){}}

idbLoad().then(()=>{if(CH.length)render(idx)});
try{const sv=JSON.parse(localStorage.getItem(SKEY)||'null'); if(sv)loadScript(sv,false)}catch(e){}
if(!CH.length){$('#en').textContent='대본 파일을 먼저 골라 주세요';$('#count').textContent='';phUpdate()}
</script>
</body>
</html>
